services:
  api:
    build: .
    env_file: .env
    environment:
      POSTGRES_DSN: postgresql://enterprise:enterprise@postgres:5432/enterprise_ai
      REDIS_URL: redis://redis:6379/0
      POLICY_VECTOR_URI: /app/data/milvus.db
      # 演示编排默认沿用 .env 中的开发配置；生产部署必须注入独立的 JWT_SECRET。
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      DEV_LOGIN_ENABLED: ${DEV_LOGIN_ENABLED:-false}
    ports: ["8000:8000"]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    volumes: ["api_data:/app/data"]

  frontend:
    build: ./frontend
    ports: ["5173:80"]
    depends_on: [api]

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: enterprise
      POSTGRES_PASSWORD: enterprise
      POSTGRES_DB: enterprise_ai
    ports: ["5432:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U enterprise -d enterprise_ai"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    command: redis-server --appendonly yes
    volumes: ["redis_data:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  postgres_data:
  redis_data:
  api_data:
